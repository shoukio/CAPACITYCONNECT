{% extends "core/base.html" %}

{% block title %}Password reset complete | Capacity Connect{% endblock %}

{% block content %}
<section class="auth-section section-pad">
    <div class="auth-card">
        <p class="section-kicker">Password reset</p>
        <h1>You’re all set</h1>
        <p class="auth-description">Your password has been reset. Sign in with your new password to continue.</p>
        <a class="button button-primary" href="{% url 'accounts:login' %}">Sign in</a>
    </div>
</section>
{% endblock %}
