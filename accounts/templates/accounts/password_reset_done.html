{% extends "core/base.html" %}

{% block title %}Check your email | Capacity Connect{% endblock %}

{% block content %}
<section class="auth-section section-pad">
    <div class="auth-card">
        <p class="section-kicker">Password reset</p>
        <h1>Check your email</h1>
        <p class="auth-description">If an account matches the email address you entered, password reset instructions have been sent.</p>
        <a class="text-link" href="{% url 'accounts:login' %}">Back to sign in <span aria-hidden="true">→</span></a>
    </div>
</section>
{% endblock %}
